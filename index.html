<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <!-- Лоадер первичная загрузка -->
    <div id="loading-comments" class="loading"> Комментарии загружаются...</div>
    <!-- Список рендерится из JS -->
    <ul class="comments" id="list-comment"></ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" id="name-input" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"
        id="name-comment"></textarea>
      <div class="add-form-row">
        <button id="button-comment" class="add-form-button">Написать </button>
      </div>
    </div>
  </div>
</body>

<script>
  // ВАЖНО
  const API_URL = 'https://wedev-api.sky.pro/api/v1/zina-khan/comments';

  const nameInputEl = document.getElementById('name-input');
  const commentInputEl = document.getElementById('name-comment');
  const listCommentEl = document.getElementById('list-comment');
  const buttonCommentEl = document.getElementById('button-comment');
  const loadingCommentsEl = document.getElementById('loading-comments');

  let comments = [];

  // 0. Экранирование HTML
  function escapeHtml(str) {
    return str
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function formatDate(isoString) {
    const d = new Date(isoString);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(-2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function mapApiComment(apiComment) {
    return {
      id: apiComment.id,
      name: apiComment.author.name,
      date: formatDate(apiComment.date),
      text: apiComment.text,
      likes: apiComment.likes,
      liked: apiComment.isLiked,
    };
  }

  // 1. Загрузка списка комментариев — отдельная функция, возвращает промис
  function fetchComments() {
    // Показываем лоадер
    loadingCommentsEl.style.display = 'block';
    listCommentEl.style.display = 'none';

    return fetch(API_URL)
      .then((response) => {
        if (!response.ok) {
          throw new Error('Ошибка загрузки комментариев');
        }
        return response.json();
      })
      .then((data) => {
        comments = data.comments.map(mapApiComment);
        renderComments();
      })
      .catch((error) => {
        console.error(error);
        alert('Не удалось загрузить комментарии. Попробуйте позже.');
        throw error;
      })
      .finally(() => {
        // Прячем лоадер — сработает и при успехе, и при ошибке
        loadingCommentsEl.style.display = 'none';
        listCommentEl.style.display = 'flex';
      });
  }

  // 2. Обработчики лайков
  const initLikeButtonsListeners = () => {
    const likeButtonsElements = document.querySelectorAll('.like-button');
    for (const likeButtonElement of likeButtonsElements) {
      likeButtonElement.addEventListener('click', (event) => {
        event.stopPropagation();
        const index = likeButtonElement.dataset.index;
        const comment = comments[index];
        if (comment.liked) {
          comment.likes = comment.likes - 1;
          comment.liked = false;
        } else {
          comment.likes = comment.likes + 1;
          comment.liked = true;
        }
        renderComments();
      });
    }
  };

  // 3. Обработчик клика по карточке
  const initCommentListeners = () => {
    const commentElements = document.querySelectorAll('.comment');
    for (const commentElement of commentElements) {
      commentElement.addEventListener('click', () => {
        const index = commentElement.dataset.index;
        const comment = comments[index];
        nameInputEl.value = comment.name;
        commentInputEl.value = `${comment.name}, ${comment.text}`;
        commentInputEl.focus();
      });
    }
  };

  // 4. Рендер
  const renderComments = () => {
    const commentsHtml = comments
      .map((comment, index) => {
        let likeButtonClass = 'like-button';
        if (comment.liked) {
          likeButtonClass = 'like-button -active-like';
        }
        const safeName = escapeHtml(comment.name);
        const safeText = escapeHtml(comment.text);

        return `<li class="comment" data-index="${index}">
          <div class="comment-header">
            <div>${safeName}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">${safeText}</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button data-index="${index}" class="${likeButtonClass}"></button>
            </div>
          </div>
        </li>`;
      })
      .join('');

    listCommentEl.innerHTML = commentsHtml;
    initLikeButtonsListeners();
    initCommentListeners();
  };

  // 5. Отправка комментария
  buttonCommentEl.addEventListener('click', () => {
    const name = nameInputEl.value.trim();
    const commentText = commentInputEl.value.trim();

    if (name.length < 3 || commentText.length < 3) {
      alert('Имя и комментарий должны содержать хотя бы 3 символа!');
      return;
    }

    // Блокируем кнопку и показываем состояние загрузки
    buttonCommentEl.disabled = true;
    buttonCommentEl.textContent = 'Отправка...';

    // ВАЖНО: сначала POST, затем повторный GET через цепочку промисов
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ name, text: commentText }),
    })
      .then((response) => {
        if (response.status === 201) {
          return response.json();
        }
        if (response.status === 400) {
          return response.json().then((err) => {
            throw new Error(err.error || 'Ошибка валидации');
          });
        }
        if (response.status === 500) {
          throw new Error('Сервер временно недоступен, попробуйте позже');
        }
        throw new Error('Неизвестная ошибка');
      })
      .then(() => fetchComments()) // перезапрашиваем список
      .then(() => {
        nameInputEl.value = '';
        commentInputEl.value = '';
      })
      .catch((error) => {
        console.error(error);
        alert(error.message);
      })
      .finally(() => {
        buttonCommentEl.disabled = false;
        buttonCommentEl.textContent = 'Написать';
      });
  });

  // Первичная загрузка
  fetchComments();

  console.log("It works!");
</script>

</html>
